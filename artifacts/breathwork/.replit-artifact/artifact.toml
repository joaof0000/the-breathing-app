kind = "web"
previewPath = "/"
title = "Breathwork"
version = "1.0.0"
id = "artifacts/breathwork"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18595

[services.development]
run = "pnpm --filter @workspace/breathwork run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/breathwork", "run", "build" ]
publicDir = "artifacts/breathwork/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18595"
BASE_PATH = "/"
