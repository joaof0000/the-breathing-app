kind = "mobile"
previewPath = "/mobile/"
title = "Breathwork Mobile"
version = "1.0.0"
id = "artifacts/breathwork-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 21243

[services.development]
run = "pnpm --filter @workspace/breathwork-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/breathwork-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/breathwork-mobile", "run", "serve" ]

[services.env]
PORT = "21243"
BASE_PATH = "/mobile/"
